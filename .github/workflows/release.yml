name: release

# Tag-driven release. A tag can never publish anything that fails CI: the `verify` job
# reuses the full ci.yml (build + test on all OSes + every gate) and every downstream job
# depends on it. Versions are taken straight from the tag (vX.Y.Z -> X.Y.Z); a tag with a
# prerelease suffix (vX.Y.Z-rc.1) flows through to a prerelease NuGet package + GitHub release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_XMLDOC_MODE: skip
  # Opt into Node 24 ahead of the runner default so credential-handling actions do
  # not emit Node 20 deprecation warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Full CI must be green before anything is packed/published.
  verify:
    name: Verify (reuse CI)
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  pack:
    name: Pack
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            # workflow_dispatch with no tag: fall back to the static prefix + run number so a
            # manual run still produces a uniquely-versioned, clearly-prerelease set.
            ver="0.1.0-manual.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${ver}"

      - name: Restore
        run: dotnet restore DotBoxD.Packages.slnx -p:DotBoxDValidatePackages=true

      - name: Build
        run: dotnet build DotBoxD.Packages.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: >-
          dotnet pack DotBoxD.Packages.slnx -p:DotBoxDValidatePackages=true -c Release --no-build
          -o artifacts/packages
          -p:Version=${{ steps.version.outputs.version }}

      - name: Check dependency licenses and generate SBOM
        run: python3 eng/supply-chain/release_inventory.py

      - name: Check package metadata
        shell: pwsh
        run: |
          ./eng/scripts/check-package-metadata.ps1 `
            -PackageDirectory artifacts/packages `
            -ExpectedVersion '${{ steps.version.outputs.version }}'

      - name: Check package consumer smoke
        shell: pwsh
        run: ./eng/scripts/check-package-consumer-smoke.ps1 -PackageDirectory artifacts/packages -Configuration Release

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest provenance
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: artifacts/packages

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/sbom.cdx.json

      - name: Attest dependency SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: artifacts/packages/*.nupkg
          sbom-path: artifacts/packages/sbom.cdx.json

  publish:
    name: Publish to NuGet.org
    needs: [pack, attest]
    runs-on: ubuntu-latest
    # Only ever publish from the canonical repo on a real version tag. Never from forks,
    # PRs, branches, or workflow_dispatch.
    if: github.event_name == 'push' && github.repository == 'JKamsker/DotBoxD' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: artifacts/packages

      - name: Obtain short-lived NuGet publishing key
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: Weirdo

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  github-release:
    name: GitHub release
    needs: [pack, attest]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: artifacts/packages

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          # A tag containing '-' (e.g. v1.2.3-rc.1) is a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/sbom.cdx.json
